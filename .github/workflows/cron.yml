name: Atualizar IPs Azure no Cloudflare

on:
  schedule:
    # Roda todo domingo às 04:00 da manhã (Horário UTC)
    - cron: '0 4 * * 0'
  workflow_dispatch: # Permite que você clique num botão para rodar manualmente quando quiser

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.x'

    - name: Instalar biblioteca Requests
      run: pip install requests

    - name: Executar script de atualização
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets::CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets::CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_LIST_ID: ${{ secrets::CLOUDFLARE_LIST_ID }}
      run: python atualizar_lista.py
